<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Message For You 🐾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="book.css" />
</head>
<body>

<!-- ═══════════════════════════════════════
     SCENE
═══════════════════════════════════════ -->
<div class="scene" aria-hidden="true">
  <div class="sky"></div>

  <div class="sun"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>
  <!-- Flying birds in the sky -->
  <div class="sky-birds">
    <span class="sky-bird sb1">〜</span>
    <span class="sky-bird sb2">〜</span>
    <span class="sky-bird sb3">〜</span>
  </div>
  <!-- Second flock — higher, slower -->
  <div class="sky-birds sky-birds-2">
    <span class="sky-bird sb1">〜</span>
    <span class="sky-bird sb2">〜</span>
    <span class="sky-bird sb3">〜</span>
    <span class="sky-bird sb4">〜</span>
  </div>
  <!-- Third flock — low, fast, smaller -->
  <div class="sky-birds sky-birds-3">
    <span class="sky-bird sb1">〜</span>
    <span class="sky-bird sb2">〜</span>
    <span class="sky-bird sb3">〜</span>
  </div>

  <!-- Background hills -->
  <div class="hill hill-l"></div>
  <div class="hill hill-r"></div>
  <div class="hill hill-c"></div>

  <!-- Ground -->
  <div class="ground"></div>

  <!-- Dirt path leading to barn -->
  <div class="dirt-path"></div>
<!-- Hay bales near barn — stacked pile -->
  <div class="hay-bale hb-1"></div>
  <div class="hay-bale hb-3"></div>
  <div class="hay-bale hb-4"></div>
  
  <!-- ══ BARN (far right, standalone zone) ══ -->
  <div class="barn-wrap">
    <!-- Silo left of barn -->
    <div class="silo">
      <div class="silo-roof"></div>
      <div class="silo-body"></div>
    </div>
    <!-- Main barn body -->
    <div class="barn-body">
      <!-- SVG roof triangle — reliable cross-browser -->
      <svg class="barn-roof-svg" viewBox="0 0 206 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="103,2 204,80 2,80" fill="#5A0A0A" stroke="#400808" stroke-width="2"/>
        <polygon points="103,2 204,80 2,80" fill="url(#roofGrad)"/>
        <defs>
          <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#400808"/>
            <stop offset="40%"  stop-color="#6B1010"/>
            <stop offset="100%" stop-color="#400808"/>
          </linearGradient>
        </defs>
      </svg>
      <!-- Weathervane on peak -->
      <div class="weathervane">
        <div class="wv-bird">🐓</div>
        <div class="wv-pole"></div>
      </div>
      <!-- Loft arch window -->
      <div class="barn-loft"></div>
      <!-- Left door -->
      <div class="barn-door barn-door-l"></div>
      <!-- Right door -->
      <div class="barn-door barn-door-r"></div>
      <!-- Side window -->
      <div class="barn-win"></div>
      <!-- Window glow -->
      <div class="barn-glow"></div>
    </div>
  </div>

  <!-- ══ TREES — all SVG so they always look like trees ══ -->

  <!-- Oak 1: far left -->
  <div class="tree tree-oak-1">
    <svg width="140" height="170" viewBox="0 0 140 170" xmlns="http://www.w3.org/2000/svg">
      <!-- trunk -->
      <rect x="60" y="110" width="20" height="60" rx="4" fill="#7B4F2E"/>
      <rect x="62" y="110" width="8"  height="60" fill="#9B6840" opacity="0.5"/>
      <!-- root bumps -->
      <ellipse cx="55" cy="168" rx="12" ry="5" fill="#6B4020"/>
      <ellipse cx="85" cy="168" rx="12" ry="5" fill="#6B4020"/>
      <!-- back canopy -->
      <ellipse cx="65" cy="88" rx="58" ry="50" fill="#2A5E22"/>
      <!-- mid canopy -->
      <ellipse cx="75" cy="80" rx="54" ry="48" fill="#357028"/>
      <!-- front canopy -->
      <ellipse cx="70" cy="90" rx="52" ry="46" fill="#4A8030"/>
      <!-- highlight -->
      <ellipse cx="52" cy="68" rx="22" ry="18" fill="#5A9A3C" opacity="0.6"/>
    </svg>
  </div>

  <!-- Oak 2: left, slightly smaller -->
  <div class="tree tree-oak-2">
    <svg width="110" height="140" viewBox="0 0 110 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="46" y="92" width="16" height="48" rx="3" fill="#7B4F2E"/>
      <rect x="48" y="92" width="6"  height="48" fill="#9B6840" opacity="0.5"/>
      <ellipse cx="48" cy="72" rx="44" ry="40" fill="#2A5E22"/>
      <ellipse cx="56" cy="65" rx="42" ry="38" fill="#357028"/>
      <ellipse cx="52" cy="74" rx="40" ry="36" fill="#4A8030"/>
      <ellipse cx="38" cy="54" rx="18" ry="14" fill="#5A9A3C" opacity="0.55"/>
    </svg>
  </div>

  <!-- Pine 1: between left oaks and center -->
  <div class="tree tree-pine-1">
    <svg width="80" height="190" viewBox="0 0 80 190" xmlns="http://www.w3.org/2000/svg">
      <!-- trunk -->
      <rect x="34" y="150" width="12" height="40" rx="3" fill="#7B4F2E"/>
      <!-- bottom tier -->
      <polygon points="40,90 4,150 76,150"  fill="#2E6020"/>
      <polygon points="40,90 6,148 74,148"  fill="#3A7828"/>
      <!-- mid tier -->
      <polygon points="40,52 10,106 70,106" fill="#358028"/>
      <polygon points="40,52 12,104 68,104" fill="#44903A"/>
      <!-- top tier -->
      <polygon points="40,16 16,66  64,66"  fill="#3A8832"/>
      <polygon points="40,16 18,64  62,64"  fill="#4A9C40"/>
      <!-- tip -->
      <polygon points="40,2  28,24  52,24"  fill="#56B048"/>
    </svg>
  </div>

  <!-- Oak 3: right of center, clear of barn -->
  <div class="tree tree-oak-3">
    <svg width="100" height="130" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <rect x="42" y="86" width="14" height="44" rx="3" fill="#7B4F2E"/>
      <rect x="44" y="86" width="5"  height="44" fill="#9B6840" opacity="0.5"/>
      <ellipse cx="44" cy="64" rx="40" ry="36" fill="#2A5E22"/>
      <ellipse cx="52" cy="57" rx="38" ry="34" fill="#357028"/>
      <ellipse cx="48" cy="66" rx="36" ry="32" fill="#4A8030"/>
      <ellipse cx="34" cy="46" rx="16" ry="12" fill="#5A9A3C" opacity="0.55"/>
    </svg>
  </div>

  <!-- Pine 2: far right, behind barn zone -->
  <div class="tree tree-pine-2">
    <svg width="68" height="160" viewBox="0 0 68 160" xmlns="http://www.w3.org/2000/svg">
      <rect x="29" y="124" width="10" height="36" rx="3" fill="#7B4F2E"/>
      <polygon points="34,76  2,124 66,124" fill="#2E6020"/>
      <polygon points="34,76  4,122 64,122" fill="#3A7828"/>
      <polygon points="34,44 10,86  58,86"  fill="#358028"/>
      <polygon points="34,44 12,84  56,84"  fill="#44903A"/>
      <polygon points="34,14 18,50  50,50"  fill="#4A9C40"/>
      <polygon points="34,2  26,18  42,18"  fill="#56B048"/>
    </svg>
  </div>

  <!-- ══ FENCES ══ -->
  <div class="fence-row fence-left">
    <div class="fp"></div><div class="fp"></div>
    <div class="fp"></div><div class="fp"></div><div class="fp"></div>
    <div class="fr fr-top"></div>
    <div class="fr fr-bot"></div>
  </div>
  <div class="fence-row fence-right">
    <div class="fp"></div><div class="fp"></div>
    <div class="fp"></div><div class="fp"></div><div class="fp"></div>
    <div class="fr fr-top"></div>
    <div class="fr fr-bot"></div>
  </div>

  <!-- ══ ANIMALS — left side ══ -->

  <!-- COW: far left, large, well spaced -->
  <div class="animal a-cow">
    <svg width="130" height="80" viewBox="0 0 130 80" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <ellipse cx="72" cy="50" rx="42" ry="22" fill="#F5F0E8" stroke="#C4B89A" stroke-width="1.5"/>
      <!-- black spot on body -->
      <ellipse cx="60" cy="43" rx="11" ry="9" fill="#2A1A0A" opacity="0.2"/>
      <ellipse cx="85" cy="55" rx="8"  ry="7" fill="#2A1A0A" opacity="0.15"/>
      <!-- udder -->
      <ellipse cx="72" cy="70" rx="12" ry="5" fill="#F5C0B8" stroke="#D4A0A0" stroke-width="1"/>
      <!-- neck -->
      <path d="M36 42 Q26 34 26 24" stroke="#C4B89A" stroke-width="14" stroke-linecap="round" fill="none"/>
      <!-- head -->
      <ellipse cx="22" cy="20" rx="16" ry="14" fill="#F5F0E8" stroke="#C4B89A" stroke-width="1.5"/>
      <!-- snout -->
      <ellipse cx="10" cy="26" rx="8" ry="6" fill="#F0C8B0" stroke="#C49880" stroke-width="1"/>
      <circle cx="8"  cy="25" r="1.5" fill="#2A1A0A" opacity="0.5"/>
      <circle cx="13" cy="25" r="1.5" fill="#2A1A0A" opacity="0.5"/>
      <!-- eye -->
      <circle cx="26" cy="16" r="3"   fill="#2A1A0A"/>
      <circle cx="27" cy="15" r="1"   fill="white"/>
      <!-- ear -->
      <ellipse cx="10" cy="11" rx="5" ry="8" fill="#F5F0E8" stroke="#C4B89A" stroke-width="1" transform="rotate(-20 10 11)"/>
      <ellipse cx="10" cy="11" rx="2.5" ry="5" fill="#F0C0B0" transform="rotate(-20 10 11)"/>
      <!-- horns -->
      <path d="M16 10 Q11 2 8 4"   stroke="#C4A06A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M24 8  Q22 0 18 2"  stroke="#C4A06A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- legs: 4 visible -->
      <rect x="40" y="66" width="9" height="14" rx="4" fill="#EDE4D8" stroke="#C4B89A" stroke-width="1"/>
      <rect x="54" y="67" width="9" height="13" rx="4" fill="#EDE4D8" stroke="#C4B89A" stroke-width="1"/>
      <rect x="76" y="67" width="9" height="13" rx="4" fill="#EDE4D8" stroke="#C4B89A" stroke-width="1"/>
      <rect x="90" y="66" width="9" height="14" rx="4" fill="#EDE4D8" stroke="#C4B89A" stroke-width="1"/>
      <!-- hooves -->
      <rect x="40" y="77" width="9" height="4" rx="2" fill="#5C3317"/>
      <rect x="54" y="77" width="9" height="4" rx="2" fill="#5C3317"/>
      <rect x="76" y="77" width="9" height="4" rx="2" fill="#5C3317"/>
      <rect x="90" y="77" width="9" height="4" rx="2" fill="#5C3317"/>
      <!-- tail -->
      <path d="M113 46 Q124 38 122 26" stroke="#C4B89A" stroke-width="3" stroke-linecap="round" fill="none"/>
      <ellipse cx="121" cy="24" rx="4" ry="5" fill="#C4B89A"/>
    </svg>
  </div>

  <!-- SHEEP: left area, clearly distinct from cow -->
  <div class="animal a-sheep">
    <svg width="95" height="68" viewBox="0 0 95 68" xmlns="http://www.w3.org/2000/svg">
      <!-- fluffy wool body using overlapping circles -->
      <circle cx="30" cy="34" r="16" fill="#ECEAE4" stroke="#D0CEC8" stroke-width="1"/>
      <circle cx="46" cy="28" r="15" fill="#ECEAE4" stroke="#D0CEC8" stroke-width="1"/>
      <circle cx="58" cy="34" r="15" fill="#ECEAE4" stroke="#D0CEC8" stroke-width="1"/>
      <circle cx="40" cy="22" r="14" fill="#F0EEE8" stroke="#D0CEC8" stroke-width="1"/>
      <circle cx="52" cy="22" r="13" fill="#F0EEE8" stroke="#D0CEC8" stroke-width="1"/>
      <!-- face -->
      <ellipse cx="14" cy="33" rx="12" ry="10" fill="#D4C8B8" stroke="#B8ACA0" stroke-width="1"/>
      <!-- snout -->
      <ellipse cx="5" cy="37"  rx="5" ry="4" fill="#C8B8A8" stroke="#A89880" stroke-width="1"/>
      <circle cx="4"  cy="36" r="1.2" fill="#2A1A0A" opacity="0.4"/>
      <circle cx="7"  cy="36" r="1.2" fill="#2A1A0A" opacity="0.4"/>
      <!-- eye -->
      <circle cx="16" cy="30" r="2.2" fill="#2A1A0A"/>
      <circle cx="17" cy="29" r="0.7" fill="white"/>
      <!-- ears -->
      <ellipse cx="5"  cy="23" rx="4" ry="7" fill="#D4C8B8" stroke="#B8ACA0" stroke-width="1" transform="rotate(-20 5 23)"/>
      <ellipse cx="20" cy="22" rx="3.5" ry="6" fill="#D4C8B8" stroke="#B8ACA0" stroke-width="1" transform="rotate(12 20 22)"/>
      <!-- legs: 4 -->
      <rect x="24" y="46" width="7" height="18" rx="3.5" fill="#D4C8B8" stroke="#B8ACA0" stroke-width="1"/>
      <rect x="34" y="46" width="7" height="18" rx="3.5" fill="#D4C8B8" stroke="#B8ACA0" stroke-width="1"/>
      <rect x="50" y="46" width="7" height="18" rx="3.5" fill="#D4C8B8" stroke="#B8ACA0" stroke-width="1"/>
      <rect x="60" y="46" width="7" height="18" rx="3.5" fill="#D4C8B8" stroke="#B8ACA0" stroke-width="1"/>
      <!-- hooves -->
      <rect x="24" y="61" width="7" height="4" rx="2" fill="#5C4030"/>
      <rect x="34" y="61" width="7" height="4" rx="2" fill="#5C4030"/>
      <rect x="50" y="61" width="7" height="4" rx="2" fill="#5C4030"/>
      <rect x="60" y="61" width="7" height="4" rx="2" fill="#5C4030"/>
    </svg>
  </div>

  <!-- HORSE: left, brown, taller -->
  <div class="animal a-horse">
    <svg width="130" height="100" viewBox="0 0 130 100" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <ellipse cx="72" cy="58" rx="42" ry="26" fill="#8B5C30" stroke="#6B4020" stroke-width="1.5"/>
      <!-- neck -->
      <path d="M36 50 Q26 32 30 16" stroke="#8B5C30" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M36 50 Q28 34 32 18" stroke="#9B6C40" stroke-width="8"  stroke-linecap="round" fill="none"/>
      <!-- head -->
      <ellipse cx="26" cy="12" rx="14" ry="11" fill="#8B5C30" stroke="#6B4020" stroke-width="1.5" transform="rotate(-15 26 12)"/>
      <!-- muzzle -->
      <ellipse cx="14" cy="18" rx="8"  ry="6"  fill="#A07050" stroke="#6B4020" stroke-width="1"/>
      <circle cx="12" cy="17" r="1.5" fill="#2A1A0A" opacity="0.5"/>
      <circle cx="16" cy="17" r="1.5" fill="#2A1A0A" opacity="0.5"/>
      <!-- eye -->
      <circle cx="28" cy="8"  r="2.8" fill="#2A1A0A"/>
      <circle cx="29" cy="7"  r="0.9" fill="white"/>
      <!-- ear -->
      <ellipse cx="34" cy="3"  rx="3.5" ry="6" fill="#8B5C30" stroke="#6B4020" stroke-width="1" transform="rotate(20 34 3)"/>
      <!-- mane -->
      <path d="M30 6 Q28 20 28 38 Q28 48 32 54" stroke="#3A2010" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M34 4 Q32 16 32 30"              stroke="#5C3A18" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <!-- legs: 4 -->
      <rect x="38" y="78" width="10" height="20" rx="5" fill="#8B5C30" stroke="#6B4020" stroke-width="1"/>
      <rect x="52" y="80" width="10" height="18" rx="5" fill="#8B5C30" stroke="#6B4020" stroke-width="1"/>
      <rect x="76" y="80" width="10" height="18" rx="5" fill="#8B5C30" stroke="#6B4020" stroke-width="1"/>
      <rect x="90" y="78" width="10" height="20" rx="5" fill="#8B5C30" stroke="#6B4020" stroke-width="1"/>
      <!-- hooves -->
      <rect x="38" y="95"  width="10" height="5" rx="2.5" fill="#2A1808"/>
      <rect x="52" y="95"  width="10" height="5" rx="2.5" fill="#2A1808"/>
      <rect x="76" y="95"  width="10" height="5" rx="2.5" fill="#2A1808"/>
      <rect x="90" y="95"  width="10" height="5" rx="2.5" fill="#2A1808"/>
      <!-- tail -->
      <path d="M114 52 Q128 42 126 26" stroke="#3A2010" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M114 58 Q130 50 128 36" stroke="#5C3A18" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </svg>
  </div>

  <!-- GOAT: second row left, elevated so visible behind horse -->
  <div class="animal a-goat">
    <svg width="100" height="78" viewBox="0 0 100 78" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <ellipse cx="58" cy="46" rx="32" ry="20" fill="#D4C8A8" stroke="#A8A070" stroke-width="1.3"/>
      <!-- neck -->
      <path d="M32 42 Q24 30 26 18" stroke="#D4C8A8" stroke-width="12" stroke-linecap="round" fill="none"/>
      <!-- head -->
      <ellipse cx="20" cy="14" rx="14" ry="12" fill="#D4C8A8" stroke="#A8A070" stroke-width="1.3"/>
      <!-- snout -->
      <ellipse cx="8"  cy="20" rx="7" ry="5" fill="#C8BCA0" stroke="#A8A070" stroke-width="1"/>
      <circle cx="6"   cy="19" r="1.3" fill="#2A1A0A" opacity="0.4"/>
      <circle cx="10"  cy="19" r="1.3" fill="#2A1A0A" opacity="0.4"/>
      <!-- beard -->
      <path d="M7 24 Q8 32 10 36" stroke="#A8A070" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- eye -->
      <ellipse cx="23" cy="11" rx="3" ry="2.2" fill="#2A1A0A"/>
      <circle  cx="24" cy="10" r="0.8" fill="white"/>
      <!-- ears -->
      <ellipse cx="8"  cy="5"  rx="4.5" ry="7" fill="#D4C8A8" stroke="#A8A070" stroke-width="1" transform="rotate(-25 8 5)"/>
      <ellipse cx="28" cy="4"  rx="4"   ry="6" fill="#D4C8A8" stroke="#A8A070" stroke-width="1" transform="rotate(15 28 4)"/>
      <!-- horns -->
      <path d="M16 6  Q10 -4 14 -8" stroke="#8B7040" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M24 4  Q22 -6 26 -8" stroke="#8B7040" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- legs: 4 -->
      <rect x="34" y="60" width="8" height="17" rx="4" fill="#D4C8A8" stroke="#A8A070" stroke-width="1"/>
      <rect x="46" y="61" width="8" height="16" rx="4" fill="#D4C8A8" stroke="#A8A070" stroke-width="1"/>
      <rect x="66" y="61" width="8" height="16" rx="4" fill="#D4C8A8" stroke="#A8A070" stroke-width="1"/>
      <rect x="78" y="60" width="8" height="17" rx="4" fill="#D4C8A8" stroke="#A8A070" stroke-width="1"/>
      <!-- hooves -->
      <rect x="34" y="74" width="8" height="4" rx="2" fill="#5C4830"/>
      <rect x="46" y="74" width="8" height="4" rx="2" fill="#5C4830"/>
      <rect x="66" y="74" width="8" height="4" rx="2" fill="#5C4830"/>
      <rect x="78" y="74" width="8" height="4" rx="2" fill="#5C4830"/>
    </svg>
  </div>

  <!-- BIRD LEFT: red cardinal, perched on fence, elevated -->
  <div class="animal a-bird-l">
    <svg width="50" height="44" viewBox="0 0 50 44" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <ellipse cx="24" cy="28" rx="14" ry="10" fill="#CC3020" stroke="#AA1810" stroke-width="1"/>
      <!-- wing -->
      <ellipse cx="20" cy="27" rx="10" ry="6" fill="#AA1810" stroke="#881008" stroke-width="0.8" transform="rotate(-10 20 27)"/>
      <!-- tail -->
      <path d="M10 30 Q2 36 4 42" stroke="#AA1810" stroke-width="3"   stroke-linecap="round" fill="none"/>
      <path d="M10 32 Q0 40 2 44"  stroke="#CC3020" stroke-width="2"   stroke-linecap="round" fill="none"/>
      <!-- head -->
      <circle cx="36" cy="18" r="11" fill="#CC3020" stroke="#AA1810" stroke-width="1"/>
      <!-- crest -->
      <path d="M36 7 Q33 0 37 2 Q41 -1 39 7" fill="#CC3020" stroke="#AA1810" stroke-width="0.8"/>
      <!-- beak -->
      <path d="M46 17 Q52 19 46 21" fill="#D4A020" stroke="#A07810" stroke-width="0.7"/>
      <!-- eye -->
      <circle cx="38" cy="17" r="2.5" fill="#1A1A1A"/>
      <circle cx="39" cy="16" r="0.8" fill="white"/>
      <!-- feet -->
      <line x1="22" y1="38" x2="18" y2="44" stroke="#C9A030" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="26" y1="38" x2="30" y2="44" stroke="#C9A030" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- ══ ANIMALS — right side ══ -->

  <!-- DOG: far right, golden retriever style -->
  <div class="animal a-dog">
    <svg width="105" height="86" viewBox="0 0 105 86" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <ellipse cx="58" cy="54" rx="36" ry="22" fill="#C8983A" stroke="#A07820" stroke-width="1.5"/>
      <!-- fur sheen -->
      <ellipse cx="48" cy="46" rx="18" ry="10" fill="#D8A840" opacity="0.4"/>
      <!-- neck -->
      <path d="M28 48 Q18 36 20 22" stroke="#C8983A" stroke-width="14" stroke-linecap="round" fill="none"/>
      <!-- head -->
      <circle cx="20" cy="20" r="18" fill="#C8983A" stroke="#A07820" stroke-width="1.5"/>
      <!-- floppy left ear -->
      <ellipse cx="5"  cy="16" rx="7" ry="13" fill="#A07820" stroke="#7A5810" stroke-width="1" transform="rotate(-16 5 16)"/>
      <!-- floppy right ear -->

<!-- ═══════════════════════════════════════
     STAGE — book centered here
═══════════════════════════════════════ -->
<main class="stage">

  <!-- Heart particles (JS-populated, floats above book when open) -->
  <div id="heartContainer" class="heart-container"></div>


  <!-- CLOSED COVER -->
  <div class="book-cover" id="bookCover">
    <div class="cover-spine-edge"></div>
    <div class="cover-front">
      <div class="cover-ribbon"></div>
      <div class="cover-paw">🐾</div>
      <h1 class="cover-title">A Little Message<br/><em>For You</em></h1>
      <p class="cover-author">from someone who cares ♡</p>
      <div class="cover-divider"></div>
      <div class="cover-animals">
        <span>🐶</span><span>🐱</span><span>🐮</span><span>🐰</span><span>🐴</span>
      </div>
      <button class="btn-open" id="btnOpen" aria-label="Open the book">
        Open the Book ↗
      </button>
      <div class="cover-ornament-bottom">✦</div>
    </div>
  </div>

  <!-- OPEN BOOK -->
  <div class="book-open hidden" id="bookOpen" role="region" aria-label="Open book">
    <div class="page page-left">
      <div class="page-texture"></div>
      <div class="page-inner" id="pageLeftInner"></div>
      <div class="page-fold-tl"></div>
      <span class="page-num pn-left" id="pageNumLeft"></span>
    </div>
    <div class="book-spine">
      <div class="spine-shadow-l"></div>
      <div class="spine-inner"></div>
      <div class="spine-shadow-r"></div>
    </div>
    <div class="page page-right">
      <div class="page-texture"></div>
      <div class="page-inner" id="pageRightInner"></div>
      <div class="page-fold-br"></div>
      <span class="page-num pn-right" id="pageNumRight"></span>
    </div>
    <button class="nav-btn nav-prev" id="btnPrev" aria-label="Previous pages" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav-btn nav-next" id="btnNext" aria-label="Next pages">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="btn-close" id="btnClose" aria-label="Close book">✕ Close</button>

    <!-- Progress dots -->
    <div id="progressDots" class="progress-dots"></div>
  </div>

</main>

<script src="book.js"></script>
